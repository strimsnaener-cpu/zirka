<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#F5EFE4">
  <title>Зірка оживає — Lava Aroma Candles</title>
  <meta name="description" content="Lava Aroma Candles: гортай готові узори й приміряй кольори на 3D-зірці.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='-10 -10 20 20'%3E%3Cpath d='M0-9.5 2-4.8 6.7-6.7 4.8-2 9.5 0 4.8 2 6.7 6.7 2 4.8 0 9.5-2 4.8-6.7 6.7-4.8 2-9.5 0-4.8-2-6.7-6.7-2-4.8Z' fill='none' stroke='%23241B15' stroke-width='1.4' stroke-linejoin='round'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500;1,600&family=Manrope:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
  <script type="importmap">{ "imports": { "three": "./vendor/three/three.module.js", "three/addons/": "./vendor/three/addons/" } }</script>
</head>
<body>
  <!-- Один аркуш: шапка · 3D-сцена в рамці з мітками обрізу · док. Без прокрутки сторінки. -->
  <div class="app">
    <header class="top">
      <span class="brand">
        <svg class="brand-mark" viewBox="-10 -10 20 20" aria-hidden="true"><path d="M0-9.5 2-4.8 6.7-6.7 4.8-2 9.5 0 4.8 2 6.7 6.7 2 4.8 0 9.5-2 4.8-6.7 6.7-4.8 2-9.5 0-4.8-2-6.7-6.7-2-4.8Z"/><circle r="2.1"/></svg>
        <span class="brand-t">LAVAAROMACANDLES</span>
      </span>
      <div class="top-r">
        <div class="light" role="group" aria-label="Світло">
          <button data-light="day" class="is-on" aria-pressed="true" aria-label="День" title="День"><span aria-hidden="true">☀️</span></button>
          <span class="light-sep" aria-hidden="true">/</span>
          <button data-light="candle" aria-pressed="false" aria-label="Вечір, тепле світло свічки" title="Вечір — світло свічки"><span aria-hidden="true">🌙</span></button>
        </div>
        <button class="help-btn" id="helpBtn" aria-label="Як це працює?">?</button>
      </div>
    </header>

    <main class="stage">
      <div class="stage-card" id="stageCard">
        <i class="crop crop-tl" aria-hidden="true"></i><i class="crop crop-tr" aria-hidden="true"></i><i class="crop crop-bl" aria-hidden="true"></i><i class="crop crop-br" aria-hidden="true"></i>
        <div class="viewer" id="viewer3d" aria-label="3D-зірка на підставці. Свайп по зірці крутить її, свайп по фону — огляд з усіх боків.">
          <div class="viewer-loading">Запалюємо зірку…</div>
        </div>
        <button class="spin-btn" data-spin><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19.5 12a7.5 7.5 0 1 1-2.4-5.5"/><path d="M17.6 2.8l-.3 3.9-3.9-.2"/></svg>Крутити зірку</button>
      </div>
    </main>

    <nav class="dock" aria-label="Розпис зірки">
      <div class="tabs" role="tablist" aria-label="Режим">
        <button role="tab" id="tab-ideas" data-tab="ideas" aria-controls="pane-ideas" aria-selected="true" class="is-on">Готові ідеї</button>
        <button role="tab" id="tab-colors" data-tab="colors" aria-controls="pane-colors" aria-selected="false" tabindex="-1">Свої кольори</button>
      </div>
      <div class="pane" id="pane-ideas" data-pane="ideas" role="tabpanel" aria-labelledby="tab-ideas">
        <div class="strip" id="strip" aria-label="Узори. Гортай вбік і тапни картку."></div>
        <button class="btn btn-ink rand" data-random><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4.5 5.2l14.3-.7.7 14.3-14.3.7z"/><circle cx="8.6" cy="8.8" r="1.2"/><circle cx="15.4" cy="15.2" r="1.2"/><circle cx="12" cy="12" r="1.2"/><circle cx="15.3" cy="8.6" r="1.2"/><circle cx="8.7" cy="15.4" r="1.2"/></svg>Випадкова ідея</button>
      </div>
      <div class="pane" id="pane-colors" data-pane="colors" role="tabpanel" aria-labelledby="tab-colors" hidden>
        <div class="parts" id="parts" aria-label="Що фарбуємо"></div>
        <div class="paints" id="paints" aria-label="Фарби"></div>
      </div>
    </nav>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
